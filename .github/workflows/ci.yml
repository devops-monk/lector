name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    # macOS arm64 is the only platform Lector targets, and the only one the
    # bundled engine has been run on. Building elsewhere would prove nothing.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # sherpa-onnx-sys downloads a prebuilt static archive into target/ and
      # rebuilding it on every run is the slowest thing in this job, so it is
      # cached alongside the registry.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sherpa-onnx-prebuilt

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets

      # The default set is offline and fast. The network tests really download
      # models, so they are opt-in and run separately below.
      - run: cargo test --workspace

      - name: Model download and checksum tests
        run: cargo test --workspace -- --ignored --test-threads=1

  build:
    runs-on: macos-14
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sherpa-onnx-prebuilt
      - run: cargo build --workspace --release
