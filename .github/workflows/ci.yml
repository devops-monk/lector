name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deliberately no RUSTFLAGS here: setting it as an environment variable makes
  # cargo ignore .cargo/config.toml's rustflags entirely, which would silently
  # drop the Windows crt-static setting. Warnings are denied in the lint job
  # instead, which is where that belongs.

jobs:
  # Style and lint once, on the platform Lector is actually developed on.
  # Running them four times would just be the same answer, slower.
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: ./.github/actions/sherpa-cache
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # Build and test everywhere we ship, so a platform breaks on a pull request
  # rather than halfway through a release.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            slug: macos-arm64
          # Intel macOS is cross-compiled from the Apple silicon runner rather
          # than built on an Intel one: macos-13 has been retired and the
          # remaining x64 images are larger runners. Cross-compiling needs no
          # scarce runner, but it does mean the result is built and never run,
          # so this job builds without testing.
          - os: macos-15
            slug: macos-x64
            target: x86_64-apple-darwin
          - os: windows-latest
            slug: windows-x64
          - os: ubuntu-22.04
            slug: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/sherpa-cache
        with:
          key: ${{ matrix.slug }}

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libasound2-dev build-essential file

      - name: Add cross-compilation target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # The default set is offline and fast. Skipped when cross-compiling, since
      # the binaries cannot run on this host.
      - name: Test
        if: matrix.target == ''
        run: cargo test --workspace

      - name: Build
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --workspace --release --target ${{ matrix.target }}
          else
            cargo build --workspace --release
          fi
        shell: bash

  # The network tests really download models, so they run once and separately:
  # a GitHub outage should not fail the fast job on four platforms at once.
  models:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/sherpa-cache
      - run: cargo test --workspace -- --ignored --test-threads=1
