[workspace]
resolver = "2"
members = ["crates/lector-text", "crates/lector-engine", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[profile.dev]
# sherpa-onnx inference in a debug build is unusably slow; the deps it pulls are
# C++ and never change, so optimising them costs one cold build and nothing after.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
