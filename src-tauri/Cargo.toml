[package]
name = "lector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-only text to speech"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
lector-engine = { path = "../crates/lector-engine" }
lector-text = { path = "../crates/lector-text" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Selection capture: synthesize the copy keystroke, then read and restore the
# clipboard. The webview cannot do either -- it is not the focused app, and on
# macOS there is no webview at all in the tray-only build.
enigo = "0.3"
arboard = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
