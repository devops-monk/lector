[package]
name = "lector"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local-only text to speech"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: the menu bar icon is loaded from a PNG at runtime rather than
# reusing the bundle icon, which is a colour icon and wrong for a menu bar.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# The file picker for importing a book. There is no other way to get a path
# from the user: a webview drop gives a File, not a location on disk.
tauri-plugin-dialog = "2"
lector-engine = { path = "../crates/lector-engine" }
lector-text = { path = "../crates/lector-text" }
lector-book = { path = "../crates/lector-book" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Reading and restoring the clipboard around the copy keystroke. The webview
# cannot do this -- it is not the focused application.
arboard = "3"

# The copy keystroke elsewhere. On macOS it is posted with CGEvent instead; see
# selection.rs for why.
[target.'cfg(not(target_os = "macos"))'.dependencies]
enigo = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# The copy keystroke is posted with CGEvent rather than through enigo. enigo
# resolves a character to a keycode by asking the Text Services Manager, and TSM
# asserts it is on the main thread -- which crashes, because the hotkey handler
# deliberately is not.
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
